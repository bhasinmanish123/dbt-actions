# ============================================================
# REUSABLE dbt CI/CD workflow (central actions repo)
# NO PASSWORDS anywhere:
#   CI  (lint + build DEV) → OIDC oauth token → Snowflake
#   CD  (build PROD)       → OIDC oauth token → Snowflake
# ============================================================
name: Reusable dbt CI/CD

on:
  workflow_call:
    inputs:
      stage:
        description: 'Which stage to run: ci (lint+dev) or cd (prod)'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      dialect:
        required: false
        type: string
        default: 'snowflake'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true
      SNOWFLAKE_USER:
        required: true
      # No SNOWFLAKE_PASSWORD — using OIDC instead

# Required for OIDC token request
permissions:
  id-token: write
  contents: read

jobs:
  # ---- CI Job 1: Lint (only when stage = ci, no Snowflake needed) ----
  lint:
    if: ${{ inputs.stage == 'ci' }}
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect ${{ inputs.dialect }} --ignore templating

  # ---- CI Job 2: Build to DEV (OIDC auth, no password) ----
  build-dev:
    if: ${{ inputs.stage == 'ci' }}
    name: dbt build to DEV
    needs: [lint]
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Fetch OIDC token from GitHub and set as env var for dbt
      - name: Get GitHub OIDC token for Snowflake
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/bhasinmanish123" \
            | jq -r '.value')

          # Decode JWT payload BEFORE masking (masking prevents later use)
          PAYLOAD=$(echo $TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null)
          echo "=== OIDC Token Claims ==="
          echo "actor:      $(echo $PAYLOAD | jq -r '.actor')"
          echo "sub:        $(echo $PAYLOAD | jq -r '.sub')"
          echo "iss:        $(echo $PAYLOAD | jq -r '.iss')"
          echo "aud:        $(echo $PAYLOAD | jq -r '.aud')"
          echo "repository: $(echo $PAYLOAD | jq -r '.repository')"
          echo "========================="

          # Now mask the full token
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_OAUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt build (DEV via OIDC)
        run: dbt build --target ci

  # ---- CD Job: Build to PROD (OIDC auth, no password) ----
  deploy-prod:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build to PROD
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Fetch OIDC token from GitHub and set as env var for dbt
      - name: Get GitHub OIDC token for Snowflake
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/bhasinmanish123" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_OAUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt build (PROD via OIDC)
        run: dbt build --target prod
