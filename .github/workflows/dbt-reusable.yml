# ============================================================
# REUSABLE dbt CI/CD workflow (central actions repo)
# Uses Snowflake Workload Identity Federation (WIF) — no passwords
# snowflake-cli-action handles OIDC token automatically
#
#   CI (lint + build CI schema)  when stage = ci
#   CD (build PROD schema)       when stage = cd
# ============================================================
name: Reusable dbt CI/CD

on:
  workflow_call:
    inputs:
      stage:
        description: 'Which stage: ci (lint+build) or cd (prod)'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      dialect:
        required: false
        type: string
        default: 'snowflake'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true

# Required for OIDC token request
permissions:
  id-token: write
  contents: read

jobs:
  # ---- CI Job 1: Lint (fast, no Snowflake needed) ----
  lint:
    if: ${{ inputs.stage == 'ci' }}
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect ${{ inputs.dialect }} --ignore templating

  # ---- CI Job 2: dbt build to CI schema (WIF OIDC) ----
  build-dev:
    if: ${{ inputs.stage == 'ci' }}
    name: dbt build (CI schema)
    needs: [lint]
    runs-on: ubuntu-latest
    environment: ci-deploy        # MUST match SUBJECT in Snowflake user
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      # Snowflake CLI handles OIDC token automatically
      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          use-oidc: true
          cli-version: "3.14.0"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build (CI schema)
        run: dbt build --target ci

  # ---- CD Job: dbt build to PROD schema (WIF OIDC) ----
  deploy-prod:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build (PROD schema)
    runs-on: ubuntu-latest
    environment: prod-deploy      # MUST match SUBJECT in Snowflake user
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      # Snowflake CLI handles OIDC token automatically
      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          use-oidc: true
          cli-version: "3.14.0"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build (PROD schema)
        run: dbt build --target prod
