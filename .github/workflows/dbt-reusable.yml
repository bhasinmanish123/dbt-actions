# ============================================================
# REUSABLE dbt CI/CD workflow
# Flow: CI (on PR) → DEV + PROD (on merge)
#
#   stage: ci  → lint + dbt build CI schema  (PR validation)
#   stage: cd  → dbt build DEV schema        (after merge)
#              → dbt build PROD schema       (after merge)
# ============================================================
name: Reusable dbt CI/CD

on:
  workflow_call:
    inputs:
      stage:
        description: 'Which stage: ci (lint+build) or cd (dev+prod)'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      dialect:
        required: false
        type: string
        default: 'snowflake'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # CI Stage (on PR): Lint + build CI schema
  # ============================================================

  lint:
    if: ${{ inputs.stage == 'ci' }}
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect ${{ inputs.dialect }} --ignore templating

  build-ci:
    if: ${{ inputs.stage == 'ci' }}
    name: dbt build (CI schema — validate)
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
      - name: Test Snowflake connection
        run: snow connection test -x
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dbt
        run: pip install dbt-snowflake
      - name: dbt deps
        run: dbt deps || true
      - name: dbt build (CI schema)
        run: dbt build --target ci

  # ============================================================
  # CD Stage (on merge): build DEV first, then PROD
  # ============================================================

  deploy-dev:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build (DEV schema)
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
      - name: Test Snowflake connection
        run: snow connection test -x
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dbt
        run: pip install dbt-snowflake
      - name: dbt deps
        run: dbt deps || true
      - name: dbt build (DEV schema)
        run: dbt build --target dev

  deploy-prod:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build (PROD schema)
    needs: [deploy-dev]              # PROD only runs after DEV succeeds
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
      - name: Test Snowflake connection
        run: snow connection test -x
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dbt
        run: pip install dbt-snowflake
      - name: dbt deps
        run: dbt deps || true
      - name: dbt build (PROD schema)
        run: dbt build --target prod
