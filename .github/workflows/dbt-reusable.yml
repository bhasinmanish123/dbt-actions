# ============================================================
# REUSABLE dbt CI/CD workflow (central actions repo)
# Uses Snowflake WIF — snowflakedb/snowflake-actions@v3
# No passwords, no keys — OIDC only
#
#   CI (lint + dbt build CI schema)  when stage = ci
#   CD (dbt build PROD schema)       when stage = cd
# ============================================================
name: Reusable dbt CI/CD

on:
  workflow_call:
    inputs:
      stage:
        description: 'Which stage: ci (lint+build) or cd (prod)'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      dialect:
        required: false
        type: string
        default: 'snowflake'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  # ---- CI Job 1: Lint (fast, no Snowflake needed) ----
  lint:
    if: ${{ inputs.stage == 'ci' }}
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect ${{ inputs.dialect }} --ignore templating

  # ---- CI Job 2: dbt build to CI schema (WIF) ----
  build-dev:
    if: ${{ inputs.stage == 'ci' }}
    name: dbt build (CI schema)
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod              # MUST match SUBJECT in Snowflake service user
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake connection
        run: snow connection test -x

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build (CI schema)
        run: dbt build --target ci

  # ---- CD Job: dbt build to PROD schema (WIF) ----
  deploy-prod:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build (PROD schema)
    runs-on: ubuntu-latest
    environment: prod              # MUST match SUBJECT in Snowflake service user
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake connection
        run: snow connection test -x

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build (PROD schema)
        run: dbt build --target prod
