# ============================================================
# REUSABLE dbt CI/CD workflow — WIF (OIDC)
# Uses setup-snowflake composite action (same pattern as Helia)
#
# FLOW:
#   PR opened  (stage: ci):
#     1. Lint (YAML + SQL)
#     2. setup-snowflake action → installs CLI, fetches OIDC token
#     3. dbt build --target ci → DEV_<github_username> (personal schema)
#
#   Merge to main (stage: cd):
#     1. setup-snowflake action → installs CLI, fetches OIDC token
#     2. dbt build --target prod → PROD schema
# ============================================================
name: Reusable dbt CI/CD

on:
  workflow_call:
    inputs:
      stage:
        description: 'Which stage: ci (PR personal schema) or cd (prod deploy)'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      dialect:
        required: false
        type: string
        default: 'snowflake'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # CI Stage (on PR): Lint + build DEV_<username> schema
  # ============================================================

  lint:
    if: ${{ inputs.stage == 'ci' }}
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect ${{ inputs.dialect }} --ignore templating

  build-ci:
    if: ${{ inputs.stage == 'ci' }}
    name: dbt build (DEV_${{ github.actor }} schema)
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}    # → generate_schema_name → DEV_USERNAME
    steps:
      - uses: actions/checkout@v4

      # ---- Composite action: install CLI + fetch OIDC token + set env vars ----
      - name: Setup Snowflake (WIF)
        uses: bhasinmanish123/dbt-actions/.github/actions/setup-snowflake@main
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → DEV_${{ github.actor }}
        run: dbt build --target ci

  # ============================================================
  # CD Stage (on merge): build PROD schema
  # ============================================================

  deploy-prod:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build (PROD schema)
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      # ---- Composite action: install CLI + fetch OIDC token + set env vars ----
      - name: Setup Snowflake (WIF)
        uses: bhasinmanish123/dbt-actions/.github/actions/setup-snowflake@main
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → PROD
        run: dbt build --target prod
