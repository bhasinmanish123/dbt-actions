# ============================================================
# REUSABLE dbt CI/CD workflow — WIF (OIDC)
#
# FLOW:
#   PR opened  (stage: ci):
#     1. Lint (YAML + SQL)
#     2. dbt build --target ci
#        → schema = DEV_<github_username>  (personal, auto-created)
#        → each developer gets their own isolated schema
#
#   Merge to main (stage: cd):
#     1. dbt build --target prod
#        → schema = PROD (shared production)
#
# WHY NO SHARED CI SCHEMA:
#   Personal schemas in CI mean each PR is fully isolated.
#   No collision between developers running at the same time.
#   Schema auto-created by generate_schema_name macro using GITHUB_ACTOR.
# ============================================================
name: Reusable dbt CI/CD

on:
  workflow_call:
    inputs:
      stage:
        description: 'Which stage: ci (PR personal schema) or cd (prod deploy)'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      dialect:
        required: false
        type: string
        default: 'snowflake'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # CI Stage (on PR):
  #   Lint → dbt build in DEV_<github_username> schema
  # ============================================================

  lint:
    if: ${{ inputs.stage == 'ci' }}
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect ${{ inputs.dialect }} --ignore templating

  build-ci:
    if: ${{ inputs.stage == 'ci' }}
    name: dbt build (DEV_${{ github.actor }} schema)
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      GITHUB_ACTOR: ${{ github.actor }}    # → generate_schema_name macro → DEV_USERNAME
    steps:
      - uses: actions/checkout@v4

      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake connection
        run: snow connection test -x

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → DEV_${{ github.actor }}
        run: dbt build --target ci

  # ============================================================
  # CD Stage (on merge to main):
  #   dbt build → PROD schema only
  #   (personal schema already validated in PR above)
  # ============================================================

  deploy-prod:
    if: ${{ inputs.stage == 'cd' }}
    name: dbt build (PROD schema)
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake connection
        run: snow connection test -x

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → PROD
        run: dbt build --target prod
